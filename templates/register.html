<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | GreenTrail</title>

  <!-- Link CSS -->
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

  <!-- Register Container -->
  <div class="auth-container">

    <div class="auth-box">
      <h2>🌱 Create Your GreenTrail Account</h2>
      <p>Join our peaceful blogging community today.</p>

      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="auth-btn">Register</button>
      </form>

      <div class="auth-link">
        <p>Already have an account?</p>
        <a href="{% url 'login' %}">Login here</a>
      </div>
    </div>

  </div>

</body>
</html>
